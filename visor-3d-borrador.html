<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gundam</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<style>
  html, body { margin: 0; height: 100%; background: #05080e; }
  .v3d-full { position: relative; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; background: #05080e; }
  .v3d-full canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: pan-y; }
  .v3d-full canvas:active { cursor: grabbing; }
  .v3d-bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: #fff;
    transform: scaleX(0); transform-origin: left; transition: transform .25s ease, opacity .6s ease .2s; pointer-events: none; }
  .v3d-bar.is-done { opacity: 0; }
</style>
</head>
<body>

<section class="v3d-full" id="visor-gundam">
  <canvas id="v3dCanvas"></canvas>
  <div class="v3d-bar" id="v3dBar"></div>
</section>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ====== AJUSTES ====== */
const MODEL_URL   = 'models/gundam.glb';
const INTRO_MS    = 3000;
const FINAL_DIR   = new THREE.Vector3(0.55, 0.2, 1);
const START_DIR   = new THREE.Vector3(-1.4, 0.9, 1);
const START_DIST  = 2.4;
const AUTOROTATE  = 0.8;                 // 0 = quieto
const FIT         = 1.0;                 // margen del encuadre (menor = más cerca)

/* Look */
const EXPOSURE    = 1.0;                 // brillo general
const BLOOM       = { strength: 0.35, radius: 0.6, threshold: 0.85 };
const CHROMATIC   = 0.0016;              // aberración cromática (0 = apagada)
const VIGNETTE    = 0.6;                 // 0 a 1
const GRAIN       = 0.025;               // 0 = sin grano
const BG_CENTER   = '#223c63';           // fondo: centro
const BG_EDGE     = '#070d18';           // fondo: bordes
const LIGHT_WARM  = 0xff5a1f;            // luz cálida (naranja)
const LIGHT_COOL  = 0x3f7dff;            // luz fría (azul)
/* ===================== */

const stage  = document.getElementById('visor-gundam');
const canvas = document.getElementById('v3dCanvas');
const bar    = document.getElementById('v3dBar');
const LOW    = matchMedia('(pointer: coarse)').matches; // celulares y tablets

const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, LOW ? 1.5 : 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; // prueba THREE.AgXToneMapping para otro contraste
renderer.toneMappingExposure = EXPOSURE;

const scene = new THREE.Scene();

/* Fondo degradado */
(function () {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(256, 235, 0, 256, 256, 380);
  gr.addColorStop(0, BG_CENTER); gr.addColorStop(1, BG_EDGE);
  g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
})();

/* Entorno + luces de color */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const warm = new THREE.DirectionalLight(LIGHT_WARM, 2.2); warm.position.set(4, 1.5, -3);
const cool = new THREE.DirectionalLight(LIGHT_COOL, 2.6); cool.position.set(-4, 3, 2.5);
const fill = new THREE.DirectionalLight(0xffffff, 0.5);   fill.position.set(1, 4, 5);
scene.add(warm, cool, fill);

const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 200);
const target = new THREE.Vector3(0, 0, 0);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.enablePan = false;
controls.enableZoom = false;
controls.enabled = false;
controls.maxPolarAngle = Math.PI * 0.52;   // no baja del suelo
controls.autoRotateSpeed = AUTOROTATE;
canvas.style.touchAction = 'pan-y';

/* Postproceso: render -> bloom -> aberración/viñeta/grano -> salida */
const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: LOW ? 0 : 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(1, 1), BLOOM.strength, BLOOM.radius, BLOOM.threshold));

const fx = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uCA: { value: CHROMATIC }, uVig: { value: VIGNETTE }, uGrain: { value: GRAIN }, uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uCA, uVig, uGrain, uTime; varying vec2 vUv;
    void main(){
      vec2 d = vUv - 0.5; float r = length(d);
      vec2 off = d * r * uCA * 6.0;
      vec4 c = texture2D(tDiffuse, vUv);
      c.r = texture2D(tDiffuse, vUv + off).r;
      c.b = texture2D(tDiffuse, vUv - off).b;
      float v = 1.0 - smoothstep(0.2, 0.85, r);
      c.rgb *= mix(1.0, v, uVig);
      float n = fract(sin(dot(vUv * (uTime + 1.0), vec2(12.9898, 78.233))) * 43758.5453);
      c.rgb += (n - 0.5) * uGrain;
      gl_FragColor = c;
    }`
});
composer.addPass(fx);
composer.addPass(new OutputPass());

/* Loader */
const draco = new DRACOLoader().setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
const ktx2  = new KTX2Loader().setTranscoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/basis/').detectSupport(renderer);
const loader = new GLTFLoader().setDRACOLoader(draco).setKTX2Loader(ktx2).setMeshoptDecoder(MeshoptDecoder);

let mixer = null, finalPos = null, startPos = null, introStart = 0, introDone = false;
const clock = new THREE.Clock();

function contactShadow(width, y) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(0,0,0,0.85)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false })
  );
  m.rotation.x = -Math.PI / 2; m.position.y = y; m.scale.setScalar(width * 1.8);
  scene.add(m);
}

function frame(model) {
  const box = new THREE.Box3().setFromObject(model);
  const scale = 3 / box.getSize(new THREE.Vector3()).y;
  model.scale.setScalar(scale);
  box.setFromObject(model);
  model.position.sub(box.getCenter(new THREE.Vector3()));
  scene.add(model);

  const fb = new THREE.Box3().setFromObject(model);
  const fs = fb.getSize(new THREE.Vector3());
  contactShadow(Math.max(fs.x, fs.z), fb.min.y - 0.01);

  const radius = fb.getBoundingSphere(new THREE.Sphere()).radius;
  const vFov = THREE.MathUtils.degToRad(camera.fov);
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
  const dist = (radius * FIT) / Math.sin(Math.min(vFov, hFov) / 2);

  finalPos = FINAL_DIR.clone().normalize().multiplyScalar(dist);
  startPos = START_DIR.clone().normalize().multiplyScalar(dist * START_DIST);
  camera.position.copy(startPos);
  camera.lookAt(target);
  introStart = performance.now();
}

loader.load(
  MODEL_URL,
  (gltf) => {
    frame(gltf.scene);
    if (gltf.animations.length) {
      mixer = new THREE.AnimationMixer(gltf.scene);
      gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
    }
    bar.style.transform = 'scaleX(1)';
    setTimeout(() => bar.classList.add('is-done'), 200);
  },
  (xhr) => { if (xhr.total) bar.style.transform = `scaleX(${xhr.loaded / xhr.total})`; },
  (err) => { console.error('No se pudo cargar', MODEL_URL, err); bar.classList.add('is-done'); }
);

/* Speed ramp: [momento 0-1, velocidad relativa] */
const RAMP = [
  [0.00, 0.2],
  [0.25, 3.2],
  [0.65, 0.4],
  [1.00, 0.05]
];

const ease = (() => {
  const N = 240, table = [0];
  const smooth = (x) => x * x * (3 - 2 * x);
  const speed = (t) => {
    for (let i = 1; i < RAMP.length; i++) {
      if (t <= RAMP[i][0]) {
        const [t0, s0] = RAMP[i - 1], [t1, s1] = RAMP[i];
        return s0 + (s1 - s0) * smooth((t - t0) / (t1 - t0));
      }
    }
    return RAMP[RAMP.length - 1][1];
  };
  for (let i = 1; i <= N; i++) table.push(table[i - 1] + speed(i / N) / N);
  const total = table[N];
  return (t) => {
    const x = Math.min(Math.max(t, 0), 1) * N, i = Math.floor(x);
    if (i >= N) return 1;
    return (table[i] + (table[i + 1] - table[i]) * (x - i)) / total;
  };
})();

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

let visible = true;
new IntersectionObserver(([e]) => { visible = e.isIntersecting; }).observe(stage);

renderer.setAnimationLoop(() => {
  if (!visible) return;
  const dt = clock.getDelta();
  if (mixer) mixer.update(dt);

  if (finalPos && !introDone) {
    const t = Math.min((performance.now() - introStart) / INTRO_MS, 1);
    camera.position.lerpVectors(startPos, finalPos, ease(t));
    camera.lookAt(target);
    if (t === 1) {
      introDone = true;
      controls.enabled = true;
      controls.autoRotate = AUTOROTATE > 0 && !matchMedia('(prefers-reduced-motion: reduce)').matches;
      controls.update();
    }
  }
  if (introDone) controls.update();
  fx.uniforms.uTime.value = performance.now() * 0.001 % 100;
  composer.render();
});
</script>
</body>
</html>
