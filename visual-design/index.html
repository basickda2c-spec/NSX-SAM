<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Digital Studio | NSXCreative</title>
<meta name="description" content="cargo.site">

<!-- ==========================================================
     Tipografía: el sitio original usa fuentes propietarias de
     Cargo (Monument Grotesk / Marist). Aquí usamos alternativas
     libres de Google Fonts con una apariencia muy cercana.
     Podés cambiarlas por las que quieras.
========================================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;1,400&family=Newsreader:ital@0;1&display=swap" rel="stylesheet">

<style>
/* =========================================================
   1) VARIABLES — todo lo que probablemente quieras editar
   ========================================================= */
:root{
  --bg: #8e8989;                 /* fondo general del sitio */
  --ink: rgba(0,0,0,0.85);       /* color de texto principal */
  --ink-soft: rgba(0,0,0,0.4);   /* color de texto secundario (captions) */
  --ink-faint: rgba(255,255,255,0.85); /* subtítulos claros sobre el fondo gris */
  --rule: rgba(0,0,0,0.85);      /* color de las líneas <hr> */

  --font-display: "Archivo", Helvetica, Arial, sans-serif; /* reemplaza Monument Grotesk */
  --font-caption: "Newsreader", Georgia, serif;            /* reemplaza Marist */

  --gutter: 1.25rem;
  --col-gap: 50px;         /* espacio entre el texto y el eje de las imágenes */
  --page-pad: 1.5rem;
  --nav-h: 4.5rem;
  --footer-h: 3.25rem;
}

*{ box-sizing: border-box; }

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-display);
  -webkit-font-smoothing:antialiased;
}

a{ color:inherit; text-decoration:none; border-bottom:1px solid transparent; }
a:hover{ border-bottom-color: currentColor; }
a:active{ opacity:.7; }

hr{
  background:var(--rule);
  border:0;
  height:1px;
  margin:1rem 0;
}

h1,h2{ margin:0; font-weight:400; font-family:var(--font-display); }

h2{
  font-size:1.5rem;
  line-height:1.2;
}

.subtle{ color:var(--ink-faint); }

.caption{
  font-family:var(--font-caption);
  font-style:italic;
  font-size:1rem;
  color:var(--ink-soft);
  display:block;
  margin-top:.5em;
}

ul{ margin:0; padding-left:1.5em; }

/* =========================================================
   2) LAYOUT GENERAL
   ========================================================= */
.site{
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

/* =========================================================
   2.1) GRID COMPARTIDO
   Este es el sistema que garantiza que ciertos bloques de
   texto queden alineados con el borde izquierdo de la imagen
   principal (.gallery).
   12 columnas iguales, mismo --gutter y mismo --page-pad en
   todas las secciones => los "cortes" de columna caen siempre
   en el mismo píxel, sin importar el ancho de pantalla.

   col-a  = columna de texto, ancho FIJO (min(100%, 26rem)) — nunca más
            ancha que el texto que contiene, así no queda aire muerto.
   col-b  = arranca justo después de col-a + un gap fijo de 50px;
            es donde arranca .gallery.
   col-c  = columna angosta a la derecha (meta, subtítulo, "Point/Line").
   col-bc = col-b + col-c juntas (para elementos que ocupan ambas,
            como .gallery, que así gana todo el espacio sobrante).
========================================================== */
.grid12{
  display:grid;
  grid-template-columns: minmax(0, 26rem) 1.3fr 1fr;
  column-gap: var(--col-gap);
  row-gap: var(--gutter);
}
.col-a{ grid-column: 1; }
.col-b{ grid-column: 2; }
.col-c{ grid-column: 3; }
.col-bc{ grid-column: 2 / 4; }

@media (max-width: 720px){
  .grid12{ grid-template-columns: 1fr; }
  .col-a, .col-b, .col-c, .col-bc{ grid-column: 1 / -1; }
}

/* Nav superior — fijo (sticky) solo en desktop; en mobile es un
   bloque normal para que no quede "trabado" tapando el resto del
   sitio al hacer scroll (ver punto 6 más abajo). */
.nav{
  position:sticky;
  top:0;
  z-index:50;
  padding: 1.25rem var(--page-pad);
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(2px);
}
.nav .links{
  position:absolute;
  top:1.25rem;
  right:var(--page-pad);
  text-align:right;
  white-space:nowrap;
}

/* Contenido central */
.pages{ flex:1 0 auto; }

.page{
  padding: var(--page-pad);
}

/* Footer inferior — fijo, semi-transparente sobre el gris */
.footer{
  position:sticky;
  bottom:0;
  z-index:50;
  display:flex;
  align-items:center;
  gap:var(--gutter);
  padding: 1.25rem var(--page-pad);
  background: color-mix(in srgb, var(--bg) 92%, transparent);
}
.footer .copyright{ flex:0 0 auto; }
.footer .top-link{ flex:1 1 auto; }
.footer .clock{ flex:0 0 auto; margin-left:auto; font-variant-numeric: tabular-nums; }

/* =========================================================
   3) HERO / BIG TITLE
   ========================================================= */
.hero{
  min-height: calc(100vh - var(--nav-h) - var(--footer-h));
  display:flex;
  align-items:flex-end;
  justify-content:flex-end;
  padding: var(--page-pad) 2.5rem var(--page-pad) var(--page-pad);
}
.hero h1{
  text-align:right;
  line-height:0.95;
  letter-spacing:-0.03em;
  font-size: clamp(2.5rem, 9vw, 8rem);
  max-width: 60%;
}

/* =========================================================
   4) PROYECTOS (Project 01 / Project 02 / Project 03)
   ========================================================= */
.project{ padding: var(--page-pad); }

.project-header{
  margin-bottom: 2.5rem;
}
.project-header .col-meta{ line-height:1.5; }

.project-body{
  align-items:flex-start;
}
.project-body .col-text{
  max-width: 26rem;
  line-height:1.5;
}
.project-body .col-text b{ font-weight:600; }
.project-body .col-text p{ margin:0 0 1em 0; }
.project-body .col-text p:last-child{ margin-bottom:0; }

/* ---------------------------------------------------------
   GALERÍA — soporta de 1 a 6 imágenes/videos, TODOS con el
   mismo tamaño (misma proporción 16:9 que tenía el video
   principal). Es un grid de 2 columnas: con 1 sola pieza
   ocupa todo el ancho, con 2 o más se acomodan de a pares,
   y nunca se "aplastan" ni rompen el layout sin importar
   cuántas agregues (probado hasta 6).
   Para agregar una pieza nueva: copiá un bloque
   <figure>...</figure> entero y pegalo dentro de .gallery.
--------------------------------------------------------- */
.gallery{
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--gutter);
}
.gallery figure{ margin:0; }
.gallery img,
.gallery video{
  display:block;
  width:100%;
  height:100%;
  aspect-ratio: 1920 / 1080;
  object-fit:cover;
  cursor: zoom-in;
}

/* Si una galería tiene una sola pieza, que ocupe las 2 columnas
   (mismo efecto que tenía antes ".g-main" solo). Agregá la clase
   "gallery--single" al div .gallery cuando pongas 1 sola imagen/video. */
.gallery.gallery--single{ grid-template-columns: 1fr; }

/* ---------------------------------------------------------
   GALERÍA VERTICAL (video/imagen 1080x1350, proporción 4:5)
   Se usa en Project 02 y Project 03. No recorta: respeta la
   proporción original. En desktop los videos se ven LADO A
   LADO (2 columnas) y el alto nunca supera la pantalla visible
   (menos nav y footer). En mobile se apilan (1 columna).
--------------------------------------------------------- */
.gallery.gallery--portrait{
  grid-template-columns: repeat(2, 1fr);
  justify-items: start;
  align-items: start;
}
.gallery.gallery--portrait figure{
  width: 100%;
  /* 0.8 = 1080/1350. El ancho máximo sale del alto de pantalla
     disponible */
  max-width: min(100%, calc((100vh - 10rem) * 0.8));
}
.gallery.gallery--portrait video,
.gallery.gallery--portrait img{
  width: 100%;
  height: auto;
  aspect-ratio: 1080 / 1350;
  object-fit: contain;
  background: #000;
}

/* ---------------------------------------------------------
   GALERÍA NATURAL — respeta la proporción REAL del video o
   imagen (vertical, horizontal o cuadrada) sin recortar.
   Agregá la clase "gallery--natural" al div .gallery y NO
   pongas width/height en el <video>.
--------------------------------------------------------- */
.gallery.gallery--natural{
  grid-template-columns: repeat(2, 1fr);
  align-items: start;
}
.gallery.gallery--natural video,
.gallery.gallery--natural img{
  width: 100%;
  height: auto;
  aspect-ratio: auto;
  object-fit: contain;
  background: #000;
}

@media (max-width: 720px){
  .gallery{ grid-template-columns: 1fr; }
  .gallery.gallery--portrait{ grid-template-columns: 1fr; }
  .gallery.gallery--natural{ grid-template-columns: 1fr; }
  /* En mobile el video vertical usa todo el ancho, sin tope por alto */
  .gallery.gallery--portrait figure{ max-width: 100%; }
}

/* =========================================================
   4.1) BANNER FULL-WIDTH (imagen o video 1920x1080)
   Bloque horizontal a ancho completo de página, pensado para
   ir entre bloques de proyecto. Mantiene proporción 16:9 y
   recorta (object-fit: cover) para llenar el espacio sin
   deformarse en ningún tamaño de pantalla.
   Para usarlo: dejá SOLO el <img> o SOLO el <video> adentro
   de .banner-media (el otro, borralo o comentalo).
========================================================== */
.banner{ padding: var(--page-pad); }
.banner-media{
  width:100%;
  aspect-ratio: 1920 / 1080;
  overflow:hidden;
  background:#000;
}
.banner-media img,
.banner-media video{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

/* =========================================================
   5) ABOUT
   ========================================================= */
.about{ padding: var(--page-pad); padding-bottom: 6rem; }
.about-grid .col-groups{ line-height:1.5; }
.about-grid .col-groups ul{ list-style:none; padding:0; margin: .75em 0 0 0; }
.about-grid .col-point{ line-height:1.55; }
.about-grid .col-point h2{ margin-bottom:.25em; }
.about-grid .col-point p{ margin:0 0 1em 0; }
.about-grid .col-point .indent{ padding-left: 1.5em; font-style: italic; }

/* =========================================================
   6) RESPONSIVE — footer apilado en mobile
   ========================================================= */
@media (max-width: 640px){
  .footer{ flex-wrap:wrap; }
  .footer .clock{ margin-left:0; }
}

/* En mobile el nav se apila (grid a 1 columna) y se vuelve muy alto;
   si sigue "sticky" queda trabado arriba tapando el resto del sitio
   al scrollear. Acá lo volvemos un bloque normal y los links dejan
   de estar en posición absoluta para no superponerse con "Cargo® Demo". */
@media (max-width: 720px){
  .nav{
    position: relative;
    top: auto;
  }
  .nav .links{
    position: static;
    text-align: left;
    margin-top: .5rem;
  }
}

/* =========================================================
   7) LIGHTBOX — ampliar imágenes con un clic
   ========================================================= */
.lightbox{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  padding: 2.5rem;
  background:#1c1c1c;
  background-image:
    linear-gradient(to right, rgba(255,255,255,.14) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.14) 1px, transparent 1px);
  background-size: 25% 33.333%;
}
.lightbox.open{
  display:flex;
  align-items:center;
  justify-content:center;
}
.lb-stage{
  max-width:90%;
  max-height:80vh;
}
.lb-stage img,
.lb-stage video{
  display:block;
  max-width:100%;
  max-height:80vh;
  width:auto;
  height:auto;
  margin:0 auto;
}
/* Video en el lightbox: respeta su proporción (horizontal o vertical)
   y nunca se sale de la pantalla. */
.lb-stage{
  display:flex;
  align-items:center;
  justify-content:center;
}
.lb-stage video{
  max-width: 100%;
  max-height: 80vh;
  margin: 0 auto;
  object-fit: contain;
}
.lb-close,
.lb-prev,
.lb-next{
  position:fixed;
  width:2.75rem;
  height:2.75rem;
  border-radius:50%;
  border:none;
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:1.4rem;
  line-height:1;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition: background .15s ease;
}
.lb-close:hover,
.lb-prev:hover,
.lb-next:hover{ background:rgba(255,255,255,.18); }
.lb-close{ top:1.5rem; right:1.5rem; }
.lb-prev{ left:1.5rem; top:50%; transform:translateY(-50%); }
.lb-next{ right:1.5rem; top:50%; transform:translateY(-50%); }
.lb-caption{
  position:fixed;
  left:2.5rem;
  bottom:2rem;
  color:rgba(255,255,255,.65);
  font-family:var(--font-display);
  font-size:.9rem;
  line-height:1.5;
}
@media (max-width:640px){
  .lightbox{ padding:1rem; }
  .lb-close{ top:1rem; right:1rem; }
  .lb-prev{ left:.5rem; }
  .lb-next{ right:.5rem; }
  .lb-caption{ left:1rem; bottom:1rem; }
}
</style>
</head>
<body>
<div class="site">

  <!-- =========================================================
       NAV SUPERIOR
       Editable: nombre de marca, título/edición, texto derecho,
       links de contacto.
       El bloque "title-block" (Párrafo 1) usa col-b, por lo
       que arranca en la misma columna que .gallery.
  ========================================================== -->
  <header class="nav grid12">
     <div class="brand col-a">
    <a href="/">NSX®Creative</a>
  </div>

    <div class="title-block col-b">
      <h2>Selected Works - 2026</h2><br>
      <h2><span class="subtle">Digital</span><br>Experience&nbsp; 01</h2>
    </div>

    <div class="subtitle-block col-c">
      Innovación <br>
      Visual<br>
