<style>
  :root{
    --swatch-1: rgba(0,0,0,.85);
    --swatch-2: rgba(0,0,0,.75);
    --swatch-3: rgba(0,0,0,.6);
    --swatch-4: rgba(0,0,0,.4);
    --window-radius: 1.6rem;
    --window-shadow: 0.4rem 0.4rem 2rem 0rem rgba(0,0,0,.18);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;font-family:"Inter",-apple-system,sans-serif;
    overflow:hidden;                 /* sin scroll en la home (las ventanas tienen su propio scroll) */
    overscroll-behavior:none;        /* sin rebote/estiramiento en iOS */
  }
  body{
    background:#000;
    color:var(--swatch-2);
  }

  .backdrop{
    position:fixed; inset:0; z-index:0; overflow:hidden; background:#000;
  }
  .backdrop canvas{
    position:absolute; inset:0; width:100%; height:100%; display:block;
    opacity:0; transition:opacity .8s ease; cursor:grab; touch-action:pan-y;
  }
  .backdrop canvas.is-ready{ opacity:1; }
  .backdrop canvas:active{ cursor:grabbing; }
  .bg3d-bar{
    position:absolute; left:0; top:0; height:2px; width:100%; background:#fff;
    transform:scaleX(0); transform-origin:left;
    transition:transform .25s ease, opacity .6s ease .2s; pointer-events:none;
  }
  .bg3d-bar.is-done{ opacity:0; }
  /* Destello de luz horizontal (lens flare anamórfico) como en la referencia */
  .flare{
    position:absolute; left:-5%; right:-5%; top:44%; height:0;
    pointer-events:none; mix-blend-mode:screen; transform:rotate(-.6deg);
    opacity:0; animation:flareIn 1.6s ease .6s forwards;
  }
  .flare::before{ /* línea fina e intensa */
    content:""; position:absolute; left:0; right:0; top:-2px; height:4px;
    background:linear-gradient(90deg,
      rgba(255,255,255,0) 22%, rgba(255,255,255,.35) 36%, rgba(255,255,255,.95) 56%,
      #fff 62%, rgba(255,255,255,.7) 74%, rgba(255,255,255,.2) 88%, rgba(255,255,255,0) 96%);
    filter:blur(1.2px);
  }
  .flare::after{ /* halo suave alrededor de la línea */
    content:""; position:absolute; left:0; right:0; top:-70px; height:140px;
    background:radial-gradient(ellipse 34% 50% at 60% 50%, rgba(255,255,255,.30), rgba(255,255,255,0) 70%);
    filter:blur(10px);
  }
  @keyframes flareIn{ to{ opacity:1; } }
  .backdrop::after{
    content:""; position:absolute; inset:0; background:rgba(0,0,0,0); pointer-events:none;
  }

  .home{
    position:relative; z-index:1; height:100vh; height:100dvh; overflow:hidden; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
    padding:2rem;
  }
  .home-grid{
    display:flex; flex-wrap:nowrap; align-items:flex-start; justify-content:center;
    gap:0; width:100%;
  }
  .home-item{
    pointer-events:auto;
    display:flex; flex-direction:column; align-items:center; gap:.7rem;
    width:11.5vw; max-width:13rem;
    text-decoration:none; cursor:pointer; background:none; border:0;
    font-family:inherit;
  }
  .home-item img{
    width:clamp(4.5rem, 8vw, 9rem); height:clamp(4.5rem, 8vw, 9rem); object-fit:contain;
    filter:drop-shadow(0 .3rem .6rem rgba(0,0,0,.5));
    transition:transform .18s ease;
  }
  .home-item:active img{ transform:scale(.94); opacity:.8; }
  .home-item .caption-light{
    font-size:clamp(.7rem, .9vw, 1rem); font-weight:450; color:#fff; text-align:center; line-height:1.2;
    filter:drop-shadow(.1rem .1rem .1rem rgba(0,0,0,.5));
    letter-spacing:.01em;
  }

  .site-footer{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    text-align:center; padding:1.2rem 1.5rem; pointer-events:none;
  }
  .site-footer span{
    color:#fff; font-size:0.6rem; font-weight:250;
    filter:drop-shadow(.1rem .1rem .1rem rgba(0,0,0,.5));
    pointer-events:auto;
  }
  .site-footer a{ color:#fff; text-decoration:underline; }

  .overlay-scrim{
    position:fixed; inset:0; z-index:100;
    display:flex; align-items:flex-start; justify-content:center;
    overflow-y:auto; padding:5rem 1rem 6rem;
    opacity:0; visibility:hidden; transition:opacity .25s ease;
    pointer-events:none;
  }
  .overlay-scrim.active{ opacity:1; visibility:visible; pointer-events:auto; }
  .window{
    background:#fff; border-radius:var(--window-radius); box-shadow:var(--window-shadow);
    width:100%; max-width:78rem; padding:2rem 2.5rem 3rem;
  }
  .window-narrow{ max-width:42rem; text-align:left; }
  .window-title{
    font-size:0.9rem; font-weight:500; color:var(--swatch-3);

  .dot-red{ color:#ff5c5f; } .dot-yellow{ color:#fac800; } .dot-green{ color:#34c759; }

  .project-meta .desc{ color:rgba(0,0,0,.75); line-height:1.4; text-align:right; }

  .gallery-grid{
    display:grid; grid-template-columns:repeat(5,1fr); gap:1.5rem; align-items:end;
    margin-bottom:3.5rem;
  }
  .gallery-grid.cols-4{ grid-template-columns:repeat(4,1fr); }
  .gallery-grid.cols-3{ grid-template-columns:repeat(3,1fr); }
  .gallery-grid.cols-2{ grid-template-columns:repeat(2,1fr); }
  .gallery-grid.cols-1{ grid-template-columns:repeat(1,1fr); }
  /* Cuando un proyecto tiene un solo elemento (ej. videos de Motion & Films), */
  /* siempre ocupa el ancho completo, sin importar el tamaño de pantalla.      */
  .gallery-grid.gallery-grid--solo{ grid-template-columns:1fr !important; }
  .gallery-item{ display:flex; flex-direction:column; }
  .ph{
    position:relative; width:100%; border-radius:.15rem; overflow:hidden;
    background:
      repeating-linear-gradient(45deg, rgba(0,0,0,.05) 0 1px, transparent 1px 24px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,.05) 0 1px, transparent 1px 24px),
      #eceeef;
    cursor:zoom-in; border:1px solid rgba(0,0,0,.06);
    display:flex; align-items:flex-end; justify-content:flex-start;
  }
  .ph.horizontal{ aspect-ratio:4/3; }
  .ph.vertical{ aspect-ratio:4/3; }
  .ph img, .ph video{ width:100%; height:100%; object-fit:cover; display:block; position:absolute; inset:0; }
  .ph video{ opacity:0; transition:opacity .4s ease; }
  .ph video.is-ready{ opacity:1; }
  .ph-label{
    position:relative; z-index:1; font-size:.7rem;
    color:rgba(0,0,0,.4); font-family:monospace; line-height:1.3;
    background:rgba(255,255,255,.6); padding:.15rem .4rem; border-radius:.2rem;
    margin:.6rem;
  }
  /* figcaption.caption ya no se usa: se quitó el texto "Image 1, Image 2..." de cada foto */

  @media (min-width:901px){
    .gallery-grid.cols-1{ grid-template-columns:repeat(2,1fr); }
  }

  @media (max-width:900px){
    .project-meta{ grid-template-columns:1fr; gap:.3rem; }
    .project-meta .desc{ text-align:left; }
    .gallery-grid{ grid-template-columns:repeat(2,1fr); }
    .gallery-grid.cols-4{ grid-template-columns:repeat(2,1fr); }
    .gallery-grid.cols-1{ grid-template-columns:repeat(1,1fr); }
    .window{ padding:1.4rem 1.2rem 2rem; }
    .home{ padding:1rem; }
    /* celular: 3 iconos arriba y 2 abajo, centrados */
    .home-grid{ flex-wrap:wrap; justify-content:center; align-items:flex-start; gap:1.8rem 0; max-width:26rem; margin:0 auto; }
    .home-item{ width:33.333%; }
    .home-item img{ width:5rem; height:5rem; aspect-ratio:1/1; }
    .home-item .caption-light{ font-size:.7rem; }
  }

  .lightbox{
    position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.9);
    display:none; align-items:center; justify-content:center; padding:3rem;
  }
  @media (min-width:901px){
    /* un poco más de espacio para la imagen/video en desktop */
    .lightbox{ padding:1.5rem 4rem; }
  }
  .lightbox.active{ display:flex; }
  .lightbox img, .lightbox video{ max-width:100%; max-height:100%; border-radius:.3rem; }
  .lightbox-close, .lightbox-prev, .lightbox-next{
    position:absolute; background:rgba(87,87,87,.4); color:#fff; border:0; border-radius:50%;
    width:2.8rem; height:2.8rem; font-size:1.3rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .lightbox-close{ top:1.5rem; right:1.5rem; }
  .lightbox-prev{ left:1.5rem; top:50%; transform:translateY(-50%); }
  .lightbox-next{ right:1.5rem; top:50%; transform:translateY(-50%); }
  .lightbox-close:active, .lightbox-prev:active, .lightbox-next:active{ opacity:.7; }
</style>
</head>

<script>
/* Reintenta reproducir los videos de las galerías tras el primer toque (iOS/móvil) */
(function(){
  const retry = () => galleryVideos.forEach(v => v.play().catch(()=>{}));
  document.addEventListener("touchstart", retry, {once:true});
  document.addEventListener("click", retry, {once:true});
})();

/* ================= CONFIG: EDITA AQUÍ TUS PROYECTOS ================= */
/* IMPORTANTE: todas tus fotos deben vivir dentro de la carpeta assets/, */
/* junto al video y a los íconos. Usa siempre rutas que empiecen con    */
/* "assets/..." — nunca pongas el archivo suelto junto al index.html.   */
/* Ej: "assets/work/proyecto1/foto-01.jpg"                               */
/* Si dejas "" (vacío) se muestra un placeholder de relleno.             */
/* NO hace falta indicar si es horizontal o vertical: el sitio lo        */
/* detecta solo según el tamaño real de cada imagen que subas.           */
/* Medida recomendada de trabajo: 2500×2300 (horizontal) o               */
/* 2300×2500 (vertical) — no es obligatorio, es solo la proporción       */
/* base con la que está armado el diseño.                                */
/*                                                                        */
/* ─── ¿CÓMO AGREGAR MÁS FOTOS O VIDEOS A UN PROYECTO EXISTENTE? ───     */
/* Solo agrega otra línea de texto dentro de "images: [ ... ]",          */
/* separada por coma. No importa el orden ni si son fotos o videos       */
/* mezclados (los .mp4/.webm/.mov se detectan solos como video).         */
/* Ejemplo:                                                              */
/*   images: [                                                           */
/*     "assets/work/project-01-01.jpg",                                  */
/*     "assets/work/project-01-02.jpg",                                  */
/*     "assets/work/project-01-05.jpg"   <-- nueva foto agregada         */
/*   ]                                                                    */
/*                                                                        */
/* ─── ¿CÓMO AGREGAR UN PROYECTO NUEVO DENTRO DE UNA SECCIÓN? ───        */
/* Copia un bloque { ... } completo (desde "{" hasta "},"), pégalo       */
/* justo antes del corchete de cierre "]" de esa sección (projects o     */
/* experiments), y cambia sus datos: number, name, subtitle, date,       */
/* description e images. No necesitas tocar nada más del código.        */
/* ¿Es para "3D & CGI"? edítalo dentro de "projects".                    */
/* ¿Es para "Motion & Films"? edítalo dentro de "experiments".           */

const stdDesc = "Praesent bibendum a elit non efficitur. Etiam et velit vitae quam aliquet fermentum. Quisque sit amet nulla dictum, cursus erat a, tempus est. Sed laoreet, magna eget mattis tincidunt.";

const projects = [
  {
    number: "01", name: "Project Name: Watara Supervision",
    subtitle: "CGI Product visualization", date: "March 2047",
    description: "The Forgotten Console Among forgotten pixels and fragile plastics, the Watara Supervision <br> emerges an artifact from the margins of handheld history",
    cols: 1,
    images: ["assets/work/project-01-01.jpg", "assets/work/project-01-02.jpg","assets/work/project-01-03.mp4", "assets/work/project-01-04.jpg"]
  },
  {
    number: "02", name: "Project Name: 2025 Naked Eye",
    subtitle: "3D Design - Animation", date: "March 2025",
    description: "A composition filled with vibrant colors and visual exuberance <br> reflecting the emotional essence of this time of year",
    cols: 1,
    images: ["assets/work/project-02-01.png", "assets/work/project-02-02.jpg", "assets/work/project-02-03.mp4", "assets/work/project-02-04.png"]
  },
  {
    number: "03", name: "Project Name: Dar Jacir",
    subtitle: "Product Visualization", date: "July 2026",
    description: "Lorem ipsum cogito ergo sum",
    cols: 1,
    images: ["assets/work/project-01-Dar-Jacir.mp4", "assets/work/DARJACIR4-1024x576.jpg","assets/work/LATAA-ARABE.png", "assets/work/DARJACIR2-1024x576.jpg"]
  },
  
];

const experiments = [
  {
    number: "01", name: "Hyper streetgear - Film",
    subtitle: "Art Direction-Film and Edit", date: "July 2018",
    description: "A short film for the Born in Chaos Release - AW 2018",
    cols: 1,
    images: ["assets/work/project-03-03.mp4"]
   },
  {
    number: "03", name: "Brtng Clothing - Infinite Sequence",
    subtitle: "Art Direction", date: "August 2021",
    description: "Release campaign for Brtng clothing cmpny",
    cols: 1,
    images: ["assets/BRIATONG_DIC_211.mp4"]
  },
  
];
/* ===================================================================== */

let lightboxImages = [];
let lightboxIndex = 0;
const galleryVideos = [];

function isVideoSrc(src){
  return /\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(src || "");
}

function makeGalleryItem(src, i, groupId){
  const wrapper = document.createElement("div");
  wrapper.className = "gallery-item";

  const box = document.createElement("div");
  box.className = "ph";
  box.dataset.group = groupId;
  box.dataset.index = i;
  box.onclick = () => openLightbox(groupId, i);

  if(src && isVideoSrc(src)){
    const video = document.createElement("video");
    video.src = src;
    video.muted = true; video.loop = true; video.autoplay = true; video.playsInline = true;
    video.preload = "auto";
    video.onloadedmetadata = () => {
      box.classList.add(video.videoWidth >= video.videoHeight ? "horizontal" : "vertical");
    };
    // muestra el primer frame (a modo de portada) apenas haya datos, aunque el autoplay falle
    video.addEventListener("loadeddata", () => video.classList.add("is-ready"), {once:true});
    video.play().catch(()=>{});
    galleryVideos.push(video);
    box.appendChild(video);
  } else if(src){
    const img = document.createElement("img");
    img.alt = "Image " + (i+1);
    img.onload = () => {
      box.classList.add(img.naturalWidth >= img.naturalHeight ? "horizontal" : "vertical");
    };
    img.src = src;
    box.appendChild(img);
  } else {
    box.classList.add(i % 2 === 0 ? "horizontal" : "vertical");
    const label = document.createElement("span");
    label.className = "ph-label";
    label.textContent = i % 2 === 0 ? "Horizontal 2500×2300" : "Vertical 2300×2500";
    box.appendChild(label);
  }

  wrapper.appendChild(box);
  return wrapper;
}

function renderProject(p, groupId){
  const cols = p.cols || 5;
  const grid = document.createElement("div");
  grid.className = "gallery-grid" + (cols !== 5 ? " cols-" + cols : "");
  if(p.images.length === 1) grid.classList.add("gallery-grid--solo");
  p.images.forEach((src, i) => grid.appendChild(makeGalleryItem(src, i, groupId)));

  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div class="project-meta">
      <b>${p.number ? p.number + "&nbsp;&nbsp;&nbsp;" : ""}${p.name}</b>
      <div class="sub">${p.subtitle}<i>${p.date}</i></div>
      <div class="desc">${p.description}</div>
    </div>
  `;
  wrap.appendChild(grid);
  return wrap;
}

const cgiContent = document.getElementById("3d-cgi-content");
projects.forEach((p, i) => {
  cgiContent.appendChild(renderProject(p, "cgi-"+i));
  if(i < projects.length - 1) cgiContent.appendChild(Object.assign(document.createElement("hr"), {className:"divider"}));
});

const motionContent = document.getElementById("motion-films-content");
experiments.forEach((p, i) => {
  motionContent.appendChild(renderProject(p, "motion-"+i));
  if(i < experiments.length - 1) motionContent.appendChild(Object.assign(document.createElement("hr"), {className:"divider"}));
});

function openWindow(id){
  document.getElementById("overlay-"+id).classList.add("active");
  history.pushState({win:id}, "", "#"+id);
}
function closeWindow(id){
  document.getElementById("overlay-"+id).classList.remove("active");
  if(location.hash === "#"+id) history.pushState({}, "", location.pathname);
}
document.querySelectorAll(".overlay-scrim").forEach(scrim=>{
  scrim.addEventListener("click", e=>{
    if(e.target === scrim){ scrim.classList.remove("active"); }
  });
});

function showLightboxItem(){
  const item = lightboxImages[lightboxIndex];
  const imgEl = document.getElementById("lightbox-img");
  const videoEl = document.getElementById("lightbox-video");
  if(!item) return;
  if(item.type === "video"){
    imgEl.style.display = "none"; imgEl.src = "";
    videoEl.style.display = "block";
    videoEl.src = item.src;
    videoEl.currentTime = 0;
    videoEl.play().catch(()=>{});
  } else {
    videoEl.pause(); videoEl.style.display = "none"; videoEl.src = "";
    imgEl.style.display = "block";
    imgEl.src = item.src;
  }
}
function openLightbox(groupId, index){
  lightboxImages = [...document.querySelectorAll(`.ph[data-group="${groupId}"]`)].map(el=>{
    const media = el.querySelector("img, video");
    if(!media) return null;
    return { src: media.currentSrc || media.src, type: media.tagName === "VIDEO" ? "video" : "image" };
  });
  if(!lightboxImages[index]) return;
  lightboxIndex = index;
  showLightboxItem();
  document.getElementById("lightbox").classList.add("active");
}
function closeLightbox(){
  document.getElementById("lightbox-video").pause();
  document.getElementById("lightbox").classList.remove("active");
}
function navLightbox(dir){
  lightboxIndex = (lightboxIndex + dir + lightboxImages.length) % lightboxImages.length;
  showLightboxItem();
}
document.addEventListener("keydown", e=>{
  if(!document.getElementById("lightbox").classList.contains("active")) return;
  if(e.key === "Escape") closeLightbox();
  if(e.key === "ArrowLeft") navLightbox(-1);
  if(e.key === "ArrowRight") navLightbox(1);
});

function tick(){
  const d = new Date();
  const months = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  const pad = n => String(n).padStart(2,"0");
  document.getElementById("clock").textContent =
    `${pad(d.getDate())} ${months[d.getMonth()]} ${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
tick(); setInterval(tick, 1000*30);

window.addEventListener("load", ()=>{
  const hash = location.hash.replace("#","");
  if(["contact","3d-cgi","motion-films"].includes(hash)) openWindow(hash);
});
</script>

<script type="module">
/* ===== FONDO 3D (reemplaza al video) ===== */
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ====== AJUSTES ====== */
const MODEL_URL   = 'models/gundam.glb';
const INTRO_MS    = 3000;
const FINAL_DIR   = new THREE.Vector3(0.55, 0.2, 1);
const START_DIR   = new THREE.Vector3(-1.4, 0.9, 1);
const START_DIST  = 2.4;
const AUTOROTATE  = 0.8;                 // 0 = quieto
const FIT_DESKTOP = (1 / 1.2) / 1.3;     // desktop: 30% más grande que antes (menor = más cerca)
const MOBILE_FILL = 0.75;                // celular: el robot ocupa 75% del ALTO de la pantalla (0.6 = más chico, 0.9 = más grande)
const MOBILE_MAX  = 900;                 // ancho (px) hasta el que se considera celular
const SHIFT_X     = 0;                   // mueve el modelo: 0.2 = 20% a la derecha, -0.2 = izquierda

const EXPOSURE    = 0.85;
const BLOOM       = { strength: 0.55, radius: 0.7, threshold: 0.8 };
const BLUR        = 0.0065;   // desenfoque del modelo (0 = nítido, 0.01 = muy borroso)
const GRAY        = 1.0;      // 1 = blanco y negro total, 0 = color original
const VIGNETTE    = 0.85;
const GRAIN       = 0.03;
const BG_CENTER   = '#161616';
const BG_EDGE     = '#000000';
const LIGHT_WARM  = 0xffffff;
const LIGHT_COOL  = 0xcfd6e6;
/* ===================== */

const stage  = document.querySelector('.backdrop');
const canvas = document.getElementById('bg-3d');
const bar    = document.getElementById('bg3dBar');
const lightbox = document.getElementById('lightbox');
const LOW    = matchMedia('(pointer: coarse)').matches;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, LOW ? 1.5 : 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = EXPOSURE;

const scene = new THREE.Scene();

(function () {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(256, 235, 0, 256, 256, 380);
  gr.addColorStop(0, BG_CENTER); gr.addColorStop(1, BG_EDGE);
  g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
})();

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const warm = new THREE.DirectionalLight(LIGHT_WARM, 3.2); warm.position.set(4, 1.5, -3);   // contraluz fuerte (borde brillante)
const cool = new THREE.DirectionalLight(LIGHT_COOL, 1.6); cool.position.set(-4, 3, 2.5);
const fill = new THREE.DirectionalLight(0xffffff, 0.3);   fill.position.set(1, 4, 5);
scene.add(warm, cool, fill);

const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 200);
const target = new THREE.Vector3(0, 0, 0);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.enablePan = false;
controls.enableZoom = false;
controls.enabled = false;
controls.maxPolarAngle = Math.PI * 0.52;
controls.autoRotateSpeed = AUTOROTATE;
canvas.style.touchAction = 'pan-y';

const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: LOW ? 0 : 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(1, 1), BLOOM.strength, BLOOM.radius, BLOOM.threshold));

const fx = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uBlur: { value: BLUR }, uAspect: { value: 1 }, uGray: { value: GRAY }, uVig: { value: VIGNETTE }, uGrain: { value: GRAIN }, uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uBlur, uAspect, uGray, uVig, uGrain, uTime; varying vec2 vUv;
    void main(){
      // desenfoque en espiral (24 muestras)
      vec3 acc = vec3(0.0); float wsum = 0.0;
      for (int i = 0; i < 24; i++) {
        float fi = float(i);
        float r = sqrt((fi + 0.5) / 24.0);
        float a = fi * 2.39996323;
        vec2 o = vec2(cos(a), sin(a)) * r * uBlur;
        o.x /= uAspect;
        acc += texture2D(tDiffuse, vUv + o).rgb; wsum += 1.0;
      }
      vec4 c = vec4(acc / wsum, 1.0);
      // blanco y negro
      float l = dot(c.rgb, vec3(0.299, 0.587, 0.114));
      c.rgb = mix(c.rgb, vec3(l), uGray);
      // viñeta + grano
      vec2 d = vUv - 0.5; float rr = length(d);
      float v = 1.0 - smoothstep(0.2, 0.85, rr);
      c.rgb *= mix(1.0, v, uVig);
      float n = fract(sin(dot(vUv * (uTime + 1.0), vec2(12.9898, 78.233))) * 43758.5453);
      c.rgb += (n - 0.5) * uGrain;
      gl_FragColor = c;
    }`
});
composer.addPass(fx);
composer.addPass(new OutputPass());

const draco = new DRACOLoader().setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
const ktx2  = new KTX2Loader().setTranscoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/basis/').detectSupport(renderer);
const loader = new GLTFLoader().setDRACOLoader(draco).setKTX2Loader(ktx2).setMeshoptDecoder(MeshoptDecoder);

let mixer = null, finalPos = null, startPos = null, introStart = 0, introDone = false, modelRadius = 0, modelHeight = 0;
const clock = new THREE.Clock();

function contactShadow(width, y) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(0,0,0,0.85)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false })
  );
  m.rotation.x = -Math.PI / 2; m.position.y = y; m.scale.setScalar(width * 1.8);
  scene.add(m);
}

/* Distancia de cámara según el tamaño de pantalla (se recalcula al redimensionar) */
function refit() {
  if (!modelRadius || !(camera.aspect > 0.05) || !isFinite(camera.aspect)) return;
  const vFov = THREE.MathUtils.degToRad(camera.fov);
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
  let dist;
  if (window.innerWidth <= MOBILE_MAX) {
    // celular: la altura del robot = MOBILE_FILL (75%) de la altura visible
    dist = (modelHeight / 2) / (MOBILE_FILL * Math.tan(vFov / 2));
  } else {
    dist = (modelRadius * FIT_DESKTOP) / Math.sin(Math.min(vFov, hFov) / 2);
  }
  if (!isFinite(dist) || dist <= 0) return;
  finalPos.copy(FINAL_DIR).normalize().multiplyScalar(dist);
  startPos.copy(START_DIR).normalize().multiplyScalar(dist * START_DIST);
  if (introDone) camera.position.setLength(dist);
}

function frame(model) {
  const box = new THREE.Box3().setFromObject(model);
  const scale = 3 / box.getSize(new THREE.Vector3()).y;
  model.scale.setScalar(scale);
  box.setFromObject(model);
  model.position.sub(box.getCenter(new THREE.Vector3()));
  scene.add(model);

  const fb = new THREE.Box3().setFromObject(model);
  const fs = fb.getSize(new THREE.Vector3());
  contactShadow(Math.max(fs.x, fs.z), fb.min.y - 0.01);

  modelRadius = fb.getBoundingSphere(new THREE.Sphere()).radius;
  modelHeight = fs.y;
  finalPos = new THREE.Vector3();
  startPos = new THREE.Vector3();
  refit();
  camera.position.copy(startPos);
  camera.lookAt(target);
  introStart = performance.now();
}

loader.load(
  MODEL_URL,
  (gltf) => {
    frame(gltf.scene);
    if (gltf.animations.length) {
      mixer = new THREE.AnimationMixer(gltf.scene);
      gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
    }
    canvas.classList.add('is-ready');
    bar.style.transform = 'scaleX(1)';
    setTimeout(() => bar.classList.add('is-done'), 200);
  },
  (xhr) => { if (xhr.total) bar.style.transform = `scaleX(${xhr.loaded / xhr.total})`; },
  (err) => { console.error('No se pudo cargar', MODEL_URL, err); canvas.classList.add('is-ready'); bar.classList.add('is-done'); }
);

/* Speed ramp: [momento 0-1, velocidad relativa] */
const RAMP = [
  [0.00, 0.2],
  [0.25, 3.2],
  [0.65, 0.4],
  [1.00, 0.05]
];

const ease = (() => {
  const N = 240, table = [0];
  const smooth = (x) => x * x * (3 - 2 * x);
  const speed = (t) => {
    for (let i = 1; i < RAMP.length; i++) {
      if (t <= RAMP[i][0]) {
        const [t0, s0] = RAMP[i - 1], [t1, s1] = RAMP[i];
        return s0 + (s1 - s0) * smooth((t - t0) / (t1 - t0));
      }
    }
    return RAMP[RAMP.length - 1][1];
  };
  for (let i = 1; i <= N; i++) table.push(table[i - 1] + speed(i / N) / N);
  const total = table[N];
  return (t) => {
    const x = Math.min(Math.max(t, 0), 1) * N, i = Math.floor(x);
    if (i >= N) return 1;
    return (table[i] + (table[i + 1] - table[i]) * (x - i)) / total;
  };
})();

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (w < 2 || h < 2) return;
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  camera.aspect = w / h;
  fx.uniforms.uAspect.value = w / h;
  refit();
  if (SHIFT_X) camera.setViewOffset(w, h, -w * SHIFT_X, 0, w, h);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

renderer.setAnimationLoop(() => {
  if (lightbox && lightbox.classList.contains('active')) return; // el lightbox tapa todo: no renderiza
  const dt = clock.getDelta();
  if (mixer) mixer.update(dt);

  if (finalPos && !introDone) {
    const t = Math.min((performance.now() - introStart) / INTRO_MS, 1);
    camera.position.lerpVectors(startPos, finalPos, ease(t));
    camera.lookAt(target);
    if (t === 1) {
      introDone = true;
      controls.enabled = true;
      controls.autoRotate = AUTOROTATE > 0 && !matchMedia('(prefers-reduced-motion: reduce)').matches;
      controls.update();
    }
  }
  if (introDone) controls.update();
  fx.uniforms.uTime.value = performance.now() * 0.001 % 100;
  composer.render();
});
</script>
